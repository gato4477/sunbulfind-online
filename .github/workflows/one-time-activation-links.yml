name: One-time activation link cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-activation-links.yml'
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message == 'chore: run one-time activation link cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace activation links and verify SEO preservation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix.lower() in ('.html', '.js', '.css', '.txt', '.md', '.json', '.xml')]
          replacements = (
              ('gatomobile.kr 또는 알뜰개통.kr', '알뜰개통.kr'),
              ('https://www.gatomobile.kr/', 'https://알뜰개통.kr/'),
              ('https://gatomobile.kr/', 'https://알뜰개통.kr/'),
              ('https://www.n-telecom.co.kr/gatoshop/view/open/selfopen_explain.aspx', 'https://알뜰개통.kr/'),
              ('gatomobile.kr', '알뜰개통.kr'),
          )
          changed = 0
          found_old = 0
          for p in files:
              original = p.read_text('utf-8')
              content = original
              found_old += original.count('gatomobile.kr')
              for before, after in replacements:
                  content = content.replace(before, after)
              if 'gatomobile.kr' in content or 'selfopen_explain.aspx' in content:
                  raise RuntimeError(f'Legacy opening URL left: {p}')
              if p.suffix == '.html':
                  canonical = lambda s: re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]*>', s)
                  if canonical(content) != canonical(original):
                      raise RuntimeError(f'Canonical URL changed: {p}')
                  if original.count('G-K88VMWDCXD') != content.count('G-K88VMWDCXD'):
                      raise RuntimeError(f'GA4 measurement changed: {p}')
              if content != original:
                  p.write_text(content, encoding='utf-8')
                  changed += 1
          assert found_old >= 3000, f'Unexpected old-link count: {found_old}'
          assert changed >= 3000, f'Unexpected update count: {changed}'
          assert len(list(Path('region').rglob('*선불폰.html'))) == 2828
          assert len(list(Path('station').rglob('*선불폰.html'))) == 490
          print(f'Updated {changed} files; removed {found_old} gatomobile.kr references; preserved all 3,318 detail URL paths and GA4 tags.')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: use 알뜰개통.kr as the only opening site across guides"
          git push origin HEAD:main
