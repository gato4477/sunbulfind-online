name: Stack article activation and chat buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guide-title-cta.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update article buttons only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter
          def link(label,url,cls,event,pos):
              return f"""<a class="guide-cta-btn {cls}" href="{url}" target="_blank" rel="noopener noreferrer" onclick="if(typeof gtag==='function')gtag('event','{event}',{{event_category:'conversion',event_label:location.pathname,cta_position:'{pos}'}})">{label}</a>"""
          def block(pos,caption):
              op=link('온라인 개통하기 ›','https://알뜰개통.kr/','guide-open','selfopen_click',pos)
              ca=link('카카오 상담하기','https://m.site.naver.com/1GQVM','guide-chat','consultation_click',pos)
              return f'<div class="guide-cta guide-cta-{pos}"><p class="guide-cta-caption">{caption}</p><div class="guide-cta-buttons" style="display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:8px">{op}{ca}</div></div>'
          paths=sorted(Path('region').rglob('*선불폰.html'))+sorted(Path('station').rglob('*선불폰.html'))
          assert len(paths)==3318
          counts=Counter()
          for p in paths:
              old=p.read_text(encoding='utf-8')
              m=re.search(r'<main\b[^>]*>[\s\S]*?</main>',old)
              assert m,p
              article=m.group(0)
              # Replace every existing body CTA, leave hero, sidebar and fixed bottom untouched.
              def replace(m):
                  pos=m.group(1).split()[0]
                  caption=re.search(r'<p[^>]*>([\s\S]*?)</p>',m.group(0))
                  counts[pos]+=1
                  return block(pos,caption.group(1) if caption else '지금 바로 개통을 진행하거나 카카오 상담을 이용하세요.')
              article=re.sub(r'<div class="guide-cta guide-cta-([^"]+)">[\s\S]*?</div></div>',replace,article)
              article=re.sub(r'<div class="article-inline-cta"[^>]*data-cta-position="([^"]+)"[^>]*>[\s\S]*?</div></div>',replace,article)
              # Add a CTA after preparation and after plans where absent, without clustering around time and SIM.
              for pos,pattern,caption in [
                  ('preparation',r'<h2\b[^>]*id=["\']open["\'][^>]*>','준비물이 있다면 온라인으로 신청하세요.'),
                  ('plans',r'</section>','원하는 요금제를 확인했다면 개통을 진행하세요.')
              ]:
                  if 'guide-cta-'+pos+'"' in article: continue
                  if pos=='plans':
                      sec=re.search(r'<section\b[^>]*class=["\']plan-section["\'][^>]*>[\s\S]*?</section>',article)
                      if sec:
                          idx=sec.end()
                      else:
                          target=re.search(r'<h2\b[^>]*>[^<]*상황별[^<]*</h2>',article)
                          idx=target.start() if target else article.rfind('</main>')
                  else:
                      target=re.search(pattern,article)
                      if not target:
                          headings=list(re.finditer(r'<h2\b[^>]*>',article))
                          target=headings[min(3,len(headings)-1)] if headings else None
                      idx=target.start() if target else article.rfind('</main>')
                  article=article[:idx]+block(pos,caption)+article[idx:]
                  counts[pos]+=1
              s=old[:m.start()]+article+old[m.end():]
              assert 'grid-template-columns:minmax(0,1fr)!important' in article,p
              for b in re.findall(r'<div class="guide-cta guide-cta-[^"]+">[\s\S]*?</div></div>',article):
                  assert b.count('온라인 개통하기')==1 and b.count('카카오 상담하기')==1 and '방문 예약하기' not in b,p
              assert re.findall(r'<nav class="guide-mobile-actions"[\s\S]*?</nav>',old)==re.findall(r'<nav class="guide-mobile-actions"[\s\S]*?</nav>',s),p
              assert re.findall(r'<img\b[^>]*>',old)==re.findall(r'<img\b[^>]*>',s),p
              assert re.findall(r'<link[^>]*rel="canonical"[^>]*>',old)==re.findall(r'<link[^>]*rel="canonical"[^>]*>',s),p
              assert s.count('G-K88VMWDCXD')==old.count('G-K88VMWDCXD'),p
              p.write_text(s,encoding='utf-8')
          print('Verified stacked article buttons on',len(paths),'pages; fixed bottom unchanged:',counts)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add region station
          git commit -m 'fix: stack full-width activation and chat buttons inside article only'
          git push origin HEAD:main
